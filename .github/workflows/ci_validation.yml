name: MACFPO CI - Validation & Quality Control

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar Dependencias y Linter
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Validar Sintaxis JSON de Configuración
      run: |
        python -m json.tool config/carbon_coefficients.json > /dev/null
        echo "✅ El archivo config/carbon_coefficients.json es un JSON válido."

    - name: Linter de Código Python (Flake8)
      run: |
        # Fallar si hay errores críticos de sintaxis o variables no definidas
        flake8 scripts_python/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Advertencias PEP8
        flake8 scripts_python/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Ejecutar Prueba de Integridad del Pipeline
      run: |
        python scripts_python/validate_pipeline.py
