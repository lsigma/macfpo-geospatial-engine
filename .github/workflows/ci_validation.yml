name: MACFPO CI - Validation & Quality Control

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validar Sintaxis JSON de Configuración
      run: |
        python -m json.tool config/carbon_coefficients.json > /dev/null
        echo "✅ El archivo config/carbon_coefficients.json es un JSON válido."

    - name: Linter de Código Python (Flake8)
      run: |
        # Detener la compilación si hay errores de sintaxis o variables no definidas
        flake8 scripts_python/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Advertencias suaves sobre estilo PEP8
        flake8 scripts_python/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Verificación Seca del Procesador Ráster
      run: |
        python -m py_compile scripts_python/raster_processor.py
        echo "✅ El script scripts_python/raster_processor.py no tiene errores sintácticos."
